<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Interaktif dengan Hiro Marker</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Gesture Support for Touch -->
  <script src="https://unpkg.com/aframe-gesture-detector/dist/aframe-gesture-detector.min.js"></script>

  <!-- Add interaction utilities -->
  <script src="https://unpkg.com/aframe-super-hands-component@4.0.5/dist/aframe-super-hands.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden">
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    gesture-detector
  >
    <!-- Marker: Hiro -->
    <a-marker preset="hiro">
      <!-- Model 3D Interaktif -->
      <a-entity id="model"
                gltf-model="generator/cyberpunk.glb"
                position="0 0 0"
                scale="0.05 0.05 0.05"
                rotation="0 0 0"
                class="interactive"
                gesture-handler
                draggable
                grabbable
                stretchable
                rotatable>
      </a-entity>
    </a-marker>

    <!-- Kamera -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Script untuk kontrol keyboard -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const model = document.querySelector('#model');

      document.body.addEventListener('keydown', (e) => {
        const step = 0.05;
        const scaleStep = 0.01;
        let pos = model.getAttribute('position');
        let rot = model.getAttribute('rotation');
        let scl = model.getAttribute('scale');

        switch (e.key) {
          case 'ArrowUp':
            pos.z -= step;
            break;
          case 'ArrowDown':
            pos.z += step;
            break;
          case 'ArrowLeft':
            pos.x -= step;
            break;
          case 'ArrowRight':
            pos.x += step;
            break;
          case 'w':
            rot.x += 5;
            break;
          case 's':
            rot.x -= 5;
            break;
          case 'a':
            rot.y += 5;
            break;
          case 'd':
            rot.y -= 5;
            break;
          case '+':
          case '=':
            scl.x += scaleStep;
            scl.y += scaleStep;
            scl.z += scaleStep;
            break;
          case '-':
            scl.x = Math.max(0.01, scl.x - scaleStep);
            scl.y = Math.max(0.01, scl.y - scaleStep);
            scl.z = Math.max(0.01, scl.z - scaleStep);
            break;
        }

        model.setAttribute('position', pos);
        model.setAttribute('rotation', rot);
        model.setAttribute('scale', scl);
      });

      model.addEventListener('model-error', (err) => {
        alert('Gagal memuat model 3D. Pastikan file dan path sudah benar.');
        console.error('Model Error:', err);
      });
    });
  </script>
</body>

</html>

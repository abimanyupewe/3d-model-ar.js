<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Model with Hiro Marker</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.min.js"></script>

  <!-- Transform Controls -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-transform-controls-component@1.0.0/dist/aframe-transform-controls-component.min.js"></script>
</head>

<body>
  <a-scene embedded arjs>
    <!-- Marker Hiro -->
    <a-marker preset="denis">
      <a-entity id="model"
                gltf-model="generator/assets/cyberpunk.glb"
                scale="0.05 0.05 0.05"
                rotation="0 0 0"
                position="0 0 0">
      </a-entity>

      <!-- Transform Controls -->
      <a-entity transform-controls="target: #model; mode: translate"></a-entity>
    </a-marker>

    <!-- Kamera -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Script untuk transform mode change -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const controls = document.querySelector('[transform-controls]');
      const model = document.querySelector('#model');

      // Tombol T, R, S untuk transformasi
      document.body.addEventListener('keydown', (e) => {
        if (e.key === 't') controls.setAttribute('transform-controls', 'mode', 'translate');
        if (e.key === 'r') controls.setAttribute('transform-controls', 'mode', 'rotate');
        if (e.key === 's') controls.setAttribute('transform-controls', 'mode', 'scale');
      });

      // jika Gagal memuat model
      model.addEventListener('model-error', (err) => {
        alert('Gagal memuat model 3D. Pastikan file dan path sudah benar.');
        console.error('Model Error:', err);
      });
    });
  </script>
</body>

</html>

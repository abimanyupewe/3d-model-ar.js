<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR with Touch & Keyboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <!-- A-Frame dan AR.js -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Gesture & Interaktif -->
  <script src="https://unpkg.com/aframe-gesture-detector@4.0.5/dist/aframe-gesture-detector.min.js"></script>
  <script src="https://unpkg.com/aframe-super-hands-component@4.0.5/dist/aframe-super-hands.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden">
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false" 
    gesture-detector 
    vr-mode-ui="enabled: false"
  >
    <!-- Marker -->
    <a-marker preset="hiro">
      <!-- Model 3D Interaktif -->
      <a-entity id="model"
        gltf-model="generator/cyberpunk.glb"
        position="0 0 0"
        scale="0.05 0.05 0.05"
        rotation="0 0 0"
        class="clickable"
        draggable
        stretchable
        rotatable
        gesture-handler>
      </a-entity>
    </a-marker>

    <!-- Kamera dengan cursor & super-hands -->
    <a-entity camera look-controls>
      <a-entity 
        cursor="rayOrigin: mouse" 
        raycaster="objects: .clickable"
        super-hands>
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- Keyboard Support -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const model = document.getElementById("model");

      document.body.addEventListener("keydown", (e) => {
        const step = 0.05;
        const rotateStep = 5;
        const scaleStep = 0.01;

        let pos = model.getAttribute("position");
        let rot = model.getAttribute("rotation");
        let scl = model.getAttribute("scale");

        switch (e.key) {
          case "ArrowUp":
            pos.z -= step;
            break;
          case "ArrowDown":
            pos.z += step;
            break;
          case "ArrowLeft":
            pos.x -= step;
            break;
          case "ArrowRight":
            pos.x += step;
            break;
          case "w":
            rot.x -= rotateStep;
            break;
          case "s":
            rot.x += rotateStep;
            break;
          case "a":
            rot.y -= rotateStep;
            break;
          case "d":
            rot.y += rotateStep;
            break;
          case "+":
          case "=":
            scl.x += scaleStep;
            scl.y += scaleStep;
            scl.z += scaleStep;
            break;
          case "-":
            scl.x = Math.max(0.01, scl.x - scaleStep);
            scl.y = Math.max(0.01, scl.y - scaleStep);
            scl.z = Math.max(0.01, scl.z - scaleStep);
            break;
        }

        model.setAttribute("position", pos);
        model.setAttribute("rotation", rot);
        model.setAttribute("scale", scl);
      });

      model.addEventListener("model-error", (e) => {
        alert("Gagal memuat model 3D. Cek path file-nya.");
        console.error("Model error:", e);
      });
    });
  </script>
</body>
</html>
